<div class="hero-label"><i class="fa-solid fa-envelope-circle-check" aria-hidden="true"></i><span>Microsoft Forms · ogłoszenie MC1427970</span></div>
<h1>Microsoft Forms zmienia domenę nadawcy automatycznych wiadomości</h1>
<p class="lead">Automatyczne powiadomienia Microsoft Forms będą wysyłane z nowego adresu. Zmiana może wpłynąć na reguły przepływu poczty, reguły skrzynek oraz filtry odwołujące się do dotychczasowego nadawcy.</p>
<div class="address-change">
<div class="address-box"><div class="address-label"><i class="fa-solid fa-circle-minus" aria-hidden="true"></i>Dotychczasowy nadawca</div><div class="address-value">maccount@microsoft.com</div></div>
<div class="address-arrow"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></div>
<div class="address-box new"><div class="address-label"><i class="fa-solid fa-circle-check" aria-hidden="true"></i>Nowy nadawca</div><div class="address-value">no-reply@forms.mail.microsoft</div></div>
</div>
</div>
<aside class="hero-side">
<div class="signal"><div class="signal-top"><div class="signal-title"><span class="dot"></span>W skrócie</div></div><div class="mini-chips"><div class="mini-chip">Microsoft Forms</div><div class="mini-chip">Exchange Online</div><div class="mini-chip">Mail flow</div><div class="mini-chip">Anti-spam</div><div class="mini-chip">Powiadomienia</div><div class="mini-chip">Nowa domena</div></div></div>
<div class="notice"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i><div><h3>Sprawdź reguły pocztowe</h3><p>Konfiguracje odnoszące się do adresu maccount@microsoft.com mogą po zmianie przestać działać zgodnie z oczekiwaniami.</p></div></div>
</aside>
</div>

<section class="section">
<div class="section-head"><h2><i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i><span>Co dokładnie się zmienia</span></h2><p class="section-desc">Zmienia się adres nadawcy automatycznych wiadomości generowanych przez Microsoft Forms.</p></div>
<div class="grid-3">
<article class="card"><div class="icon"><i class="fa-solid fa-receipt" aria-hidden="true"></i></div><div class="eyebrow">Potwierdzenia</div><h3>Potwierdzenia przesłania odpowiedzi</h3><p>Wiadomości potwierdzające przesłanie formularza będą używały adresu no-reply@forms.mail.microsoft.</p></article>
<article class="card"><div class="icon"><i class="fa-solid fa-bell" aria-hidden="true"></i></div><div class="eyebrow">Powiadomienia</div><h3>Informacje o nowych odpowiedziach</h3><p>Automatyczne wiadomości informujące właściciela formularza o nowej odpowiedzi zostaną wysłane z nowej domeny.</p></article>
<article class="card"><div class="icon"><i class="fa-solid fa-chart-line" aria-hidden="true"></i></div><div class="eyebrow">Monitoring</div><h3>Aktualizacje monitorowania odpowiedzi</h3><p>Powiadomienia związane z monitorowaniem odpowiedzi Forms również przejdą na nowy adres nadawcy.</p></article>
</div>
</section>

<section class="section">
<div class="section-head"><h2><i class="fa-solid fa-calendar-days" aria-hidden="true"></i><span>Harmonogram wdrożenia</span></h2><p class="section-desc">Zmiana będzie wdrażana etapami w zależności od środowiska Microsoft 365.</p></div>
<div class="rollout">
<article class="rollout-card"><div class="date">Połowa sierpnia – początek września 2026</div><h3>Środowiska Worldwide</h3><p>Wdrożenie rozpocznie się w połowie sierpnia 2026 r. i powinno zakończyć się na początku września 2026.</p></article>
<article class="rollout-card"><div class="date">Początek – połowa września 2026</div><h3>GCC, GCC High i DoD</h3><p>Wdrożenie rozpocznie się na początku września 2026 r. i powinno zakończyć się w połowie września 2026 r.</p></article>
</div>
</section>

<section class="section">
<div class="section-head"><h2><i class="fa-solid fa-building-shield" aria-hidden="true"></i><span>Wpływ na organizację</span></h2><p class="section-desc">Największe znaczenie ma zmiana dla organizacji filtrujących lub klasyfikujących pocztę na podstawie adresu nadawcy.</p></div>
<div class="grid-3">
<article class="card"><div class="eyebrow">Microsoft Forms</div><h3>Automatyczne wiadomości</h3><p>Wszystkie objęte zmianą powiadomienia będą wysyłane z no-reply@forms.mail.microsoft.</p><div class="impact-list"><div class="impact-item"><i class="fa-solid fa-check" aria-hidden="true"></i><span>potwierdzenia odpowiedzi</span></div><div class="impact-item"><i class="fa-solid fa-check" aria-hidden="true"></i><span>powiadomienia o nowych odpowiedziach</span></div><div class="impact-item"><i class="fa-solid fa-check" aria-hidden="true"></i><span>aktualizacje monitorowania Forms</span></div></div></article>
<article class="card"><div class="eyebrow">Exchange Online</div><h3>Reguły mogą wymagać aktualizacji</h3><p>Reguły przepływu poczty i reguły skrzynek wskazujące poprzedni adres nadawcy mogą przestać rozpoznawać wiadomości Forms.</p><div class="impact-list"><div class="impact-item"><i class="fa-solid fa-code-branch" aria-hidden="true"></i><span>mail flow rules</span></div><div class="impact-item"><i class="fa-solid fa-inbox" aria-hidden="true"></i><span>reguły skrzynki odbiorczej</span></div><div class="impact-item"><i class="fa-solid fa-folder-tree" aria-hidden="true"></i><span>automatyczne przekierowanie i segregowanie</span></div></div></article>
<article class="card"><div class="eyebrow">Filtrowanie poczty</div><h3>Zweryfikuj listy dozwolonych nadawców</h3><p>Systemy antyspamowe i zewnętrzne bramy pocztowe mogą wymagać dodania nowego adresu lub domeny do odpowiedniej listy.</p><div class="impact-list"><div class="impact-item"><i class="fa-solid fa-shield" aria-hidden="true"></i><span>polityki antyspamowe</span></div><div class="impact-item"><i class="fa-solid fa-list-check" aria-hidden="true"></i><span>listy bezpiecznych nadawców</span></div><div class="impact-item"><i class="fa-solid fa-filter" aria-hidden="true"></i><span>zewnętrzne rozwiązania filtrujące</span></div></div></article>
</div>
</section>

<section class="section">
<div class="section-head"><h2><i class="fa-solid fa-list-check" aria-hidden="true"></i><span>Co powinien zrobić administrator</span></h2><p class="section-desc">Zmiana nie wymaga działania w każdej organizacji, ale istniejące zależności od starego adresu trzeba sprawdzić przed wdrożeniem.</p></div>
<div class="action-list">
<article class="action"><div><h3>Wyszukaj stary adres</h3><p>Przejrzyj reguły przepływu poczty, reguły skrzynek i polityki filtrowania pod kątem maccount@microsoft.com.</p></div></article>
<article class="action"><div><h3>Zaktualizuj konfiguracje</h3><p>Zastąp lub uzupełnij zależności nowym adresem no-reply@forms.mail.microsoft, zachowując okres przejściowy, jeżeli jest potrzebny.</p></div></article>
<article class="action"><div><h3>Zweryfikuj bezpiecznych nadawców</h3><p>Rozważ dodanie nowego nadawcy do list dozwolonych, jeżeli wynika to z polityki bezpieczeństwa i konfiguracji organizacji.</p></div></article>
<article class="action"><div><h3>Poinformuj użytkowników i help desk</h3><p>Przekaż informację osobom obsługującym formularze oraz zespołowi wsparcia, aby nowy adres nie został uznany za podejrzany.</p></div></article>
</div>
</section>

<section class="section">
<div class="grid-2">
<article class="highlight"><h2>Własna domena nadal jest obsługiwana</h2><p>Organizacje, które skonfigurowały wysyłanie systemowych powiadomień z własnej zweryfikowanej domeny, nadal mogą korzystać z tej możliwości. Ustawienie pozostaje zarządzane przez administratora organizacji.</p></article>
<article class="card tldr"><div class="eyebrow">TL;DR</div><h3>Zmień zależności od starego nadawcy</h3><p><strong>Było:</strong> maccount@microsoft.com<br><br><strong>Będzie:</strong> no-reply@forms.mail.microsoft<br><br><strong>Termin Worldwide:</strong> od połowy sierpnia do początku września 2026<br><br><em>Najważniejsze zadanie to przegląd reguł pocztowych i filtrów.</em></p></article>
</div>
</section>

<section class="section">
<div class="grid-2">
<article class="card"><div class="eyebrow">Zgodność</div><h3>Brak wskazanych nowych wymagań</h3><p>Microsoft nie wskazał szczególnych nowych kwestii zgodności. Organizacja powinna jednak ocenić zmianę zgodnie z własnymi wymaganiami i politykami.</p></article>
<article class="card"><div class="eyebrow">Źródło</div><h3>Microsoft Learn</h3><p>Dokumentacja opisuje wybór własnej domeny dla systemowych wiadomości wysyłanych przez produkty Microsoft 365.</p><div class="cta-actions" style="margin-top:16px;"><a class="btn" href="https://learn.microsoft.com/en-us/microsoft-365/admin/email/select-domain-to-use-for-email-from-microsoft-365-products?view=o365-worldwide" target="_blank" rel="noopener noreferrer">Przeczytaj dokumentację <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></a></div></article>
</div>
</section>
